# Slim-Variante: ohne Python-Interpreter, der Viewer nutzt ein System-Python mit venv.
# Die full-Variante steht in electron-builder.full.yml und erweitert diese Datei.
appId: io.github.developer-simon.mailophant
productName: Mailophant
directories:
  output: dist/slim
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../mailviewer
    to: mailviewer
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../static
    to: static
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
linux:
  target: AppImage
  # Einzelne Größen bis 512 px: Flatpak nimmt keine größeren Icons an, nur mit icon.png fehlte es dort ganz.
  icon: assets/icons
  category: Office
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
mac:
  target: dmg
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
win:
  target: nsis
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
