# Slim variant: no Python interpreter, the viewer uses a system Python with a venv.
# The full variant is in electron-builder.full.yml and extends this file.
appId: io.github.developer-simon.mailophant
productName: Mailophant
directories:
  output: dist/slim
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../mailviewer
    to: mailviewer
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../static
    to: static
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
linux:
  target: AppImage
  # Separate sizes up to 512 px: Flatpak takes no larger icons, and with only icon.png it had none at all.
  icon: assets/icons
  category: Office
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
mac:
  target: dmg
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
win:
  target: nsis
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
