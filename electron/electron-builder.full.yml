# Full-Variante: wie electron-builder.yml, zusätzlich mit gebündeltem Python-Interpreter
# (electron/build/python, erzeugt von `npm run build:runtime`).
extends: ./electron-builder.yml
appId: io.github.developer-simon.mailophant
productName: Mailophant
# directories und files werden hier vollständig wiederholt, damit buildResources und das Icon
# auch dann gelten, wenn extends Objekte nicht tief zusammenführt.
directories:
  output: dist/full
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../mailviewer
    to: mailviewer
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../static
    to: static
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: build/python
    to: python
linux:
  # Flatpak nur hier: in der Sandbox gibt es kein System-Python, die slim-Variante liefe dort nicht.
  target: [AppImage, flatpak]
  # Einzelne Größen bis 512 px: Flatpak nimmt keine größeren Icons an, nur mit icon.png fehlte es dort ganz.
  icon: assets/icons
  category: Office
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
flatpak:
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  runtimeVersion: "26.08"
  baseVersion: "26.08"
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio      # MP3-Vorschau
    - --share=network          # Proton-Abruf und Download der Export-CLI
    - --filesystem=home        # Bibliothek und Exporte liegen irgendwo im Home
    - --filesystem=/run/media  # alte Platten mit .pst-Dateien
    - --filesystem=/media
    - --talk-name=org.freedesktop.Notifications
mac:
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
win:
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
