# Full variant: like electron-builder.yml, plus a bundled Python interpreter
# (electron/build/python, created by `npm run build:runtime`).
extends: ./electron-builder.yml
appId: io.github.developer-simon.mailophant
productName: Mailophant
# directories and files are repeated here in full, so buildResources and the icon
# still apply if extends doesn't merge objects deeply.
directories:
  output: dist/full
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../mailviewer
    to: mailviewer
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../static
    to: static
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: build/python
    to: python
linux:
  # Flatpak only here: the sandbox has no system Python, so the slim variant wouldn't run there.
  target: [AppImage, flatpak]
  # Separate sizes up to 512 px: Flatpak takes no larger icons, and with only icon.png it had none at all.
  icon: assets/icons
  category: Office
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
flatpak:
  desktop:
    entry:
      "Comment[de]": Proton-Mail- und Outlook-Backups lesen, durchsuchen, taggen und archivieren
  runtimeVersion: "26.08"
  baseVersion: "26.08"
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio      # MP3-Vorschau
    - --share=network          # Proton fetch and download of the export CLI
    - --filesystem=home        # library and exports live anywhere in home
    - --filesystem=/run/media  # old disks with .pst files
    - --filesystem=/media
    - --talk-name=org.freedesktop.Notifications
mac:
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
win:
  artifactName: "${productName}-${version}-${arch}-full.${ext}"
