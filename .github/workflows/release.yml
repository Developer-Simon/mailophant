# Release build: a tag like v0.2.0 builds the desktop installer (full variant with bundled Python)
# on each platform and attaches them to a GitHub release of that tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds the installers as workflow artifacts, without a release

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Python tests
        run: python -m unittest discover tests
      - name: Electron tests
        working-directory: electron
        run: npm ci && npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # AppImage, x64
          - os: macos-latest    # dmg, arm64
          - os: macos-15-intel  # dmg, x64
          - os: windows-latest  # NSIS installer, x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - name: Bundled Python runtime
        run: npm run build:runtime

      - name: Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code signing yet
        run: npx electron-builder --config electron-builder.full.yml --publish never

      - name: Smoke test without Python in PATH
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          xvfb-run -a bash -c 'env -i HOME="$HOME" DISPLAY="$DISPLAY" dist/full/linux-unpacked/mailophant --smoke --no-sandbox'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            electron/dist/full/*-full.AppImage
            electron/dist/full/*-full.dmg
            electron/dist/full/*-full.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # Sigstore certificate for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Provenance: `gh attestation verify <file> --repo <owner>/mailophant` proves the installer was
      # built by this workflow from this tag.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: installers/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Mailophant ${GITHUB_REF_NAME#v}" \
            --generate-notes $prerelease *
